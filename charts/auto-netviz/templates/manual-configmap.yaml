{{- if not .Values.server.manual.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "auto-netviz.fullname" . }}-manual
  labels:
    {{- include "auto-netviz.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  {{- if .Values.server.manual.files }}
  {{- range $name, $content := .Values.server.manual.files }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
  {{- else }}
  00-default.yaml: |
    schema_version: 1
    rules:
      auto_create:
        network_devices: true
        servers: true
        wired_clients: true
        wireless_clients: false
  {{- end }}
{{- end }}
