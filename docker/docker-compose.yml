services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    ports:
      - "8080:8080"
    volumes:
      - ../examples/manual:/manual:ro
      - server-data:/data
    environment:
      AUTONETVIZ_LISTEN: ":8080"
      AUTONETVIZ_DB_PATH: "/data/auto-netviz.db"
      AUTONETVIZ_MANUAL_DIR: "/manual"

  collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile.collector
    depends_on:
      - server
    command: ["--demo", "--server-ws", "ws://server:8080/ws/collector", "--id", "demo-collector", "--site", "hq"]

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    depends_on:
      - server
    ports:
      - "3000:3000"
    environment:
      BACKEND_INTERNAL_URL: "http://server:8080"
      ORIGIN: "http://localhost:3000"

volumes:
  server-data:
